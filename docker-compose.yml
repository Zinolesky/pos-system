services:
  backend-api:
    build:
      context: .
      dockerfile: src/PosSystem.Backend/Dockerfile
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=${POSTGRES_DB:-PosBackend};Username=${POSTGRES_USER:-pos_admin};Password=${POSTGRES_PASSWORD:-DevLocalDbPassword123!}
      - Jwt__Key=${JWT_SECRET_KEY:-}
      - Jwt__Issuer=${JWT_ISSUER:-PrimePOS}
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevLocalDbPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-PosBackend}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
